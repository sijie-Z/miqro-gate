# Watches the official postgres:17-alpine digest (Docker Official Images) and
# opens/updates a PR when it moves. docker-library rebuilds the alpine image
# whenever alpine security updates land; this workflow is the tripwire that
# picks those rebuilds up and re-runs the Security gate against the new
# digest. The util-linux exemptions in deploy/security/.trivyignore.yaml
# (added 2026-09-07) expire on 2026-10-07 and are meant to be dropped once
# this workflow lands a rebuild that no longer needs them.
name: postgres-image-update

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: postgres-image-update
  cancel-in-progress: false

jobs:
  compare-digest:
    name: Compare pinned digest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main

      - name: Raise or update PR when the official digest moves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          COMPOSE=deploy/compose.yaml
          PINNED=$(sed -n 's/^.*@\(sha256:[0-9a-f]\{64\}\).*/\1/p' "$COMPOSE" | head -1)
          if [ -z "$PINNED" ]; then
            echo "::error::no digest-pinned image found in $COMPOSE"; exit 1
          fi
          # Resolve the current official multi-platform list digest for postgres:17-alpine.
          TOKEN=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/postgres:pull" | jq -r .token)
          NEW=$(curl -fsS -D - -o /dev/null \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
            "https://registry-1.docker.io/v2/library/postgres/manifests/17-alpine" \
            | tr -d '\r' | sed -n 's/^docker-content-digest: //p')
          if [ -z "$NEW" ]; then
            echo "::error::could not resolve upstream postgres:17-alpine digest"; exit 1
          fi
          echo "pinned:  $PINNED"
          echo "upstream: $NEW"
          [ "$PINNED" = "$NEW" ] && { echo "digest unchanged — nothing to do"; exit 0; }

          BRANCH=ci/postgres-image-update
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH" main --quiet
          sed -i "s/$PINNED/$NEW/" "$COMPOSE"
          git add "$COMPOSE"
          git commit -m "chore(deploy): bump postgres alpine image digest

          $PINNED -> $NEW (official postgres:17-alpine rebuild).

          Follow-up for the reviewer, after the Security gate on this PR:
          * drop util-linux entries in deploy/security/.trivyignore.yaml that
            no longer apply (the 2026-09-07 set expires 2026-10-07 anyway);
          * if the new build is a newer 17.x-alpine tag, update the image
            label and the comment in $COMPOSE to match (digest stays pinned)."
          if git ls-remote --exit-code origin "$BRANCH" >/dev/null 2>&1; then
            git push --force origin "$BRANCH"
            echo "existing branch updated"
          else
            git push -u origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deploy): postgres alpine image digest update" \
              --body "Official \`postgres:17-alpine\` was rebuilt upstream (docker-library alpine refresh).

Pinned digest: \`$PINNED\` -> \`$NEW\`

This PR exists so the Security gate re-scans the new digest against \`deploy/security/.trivyignore.yaml\`. After it goes green:
* drop the util-linux exceptions there if the new build no longer needs them (they expire 2026-10-07 by design);
* update the image label/comment in \`deploy/compose.yaml\` if the build moved to a newer \`17.x-alpine\` tag (the digest pin is what matters).
🤖 Auto-generated by the postgres-image-update workflow."
          fi
