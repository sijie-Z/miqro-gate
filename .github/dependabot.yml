# Dependabot version updates — keep npm / Maven / Actions dependencies
# fresh with automatic PRs. Security updates are always enabled
# regardless of this file.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    # PR 目标分支必须是集成分支：默认分支 main 只在发布时同步（#494 教训：
    # 缺省时 dependabot 开向 main，依赖升级会绕过 develop 的验证线）。
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(frontend)"
    labels:
      - dependencies

  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build(backend)"
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
