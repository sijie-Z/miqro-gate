# Postgres image scan exemptions. Each entry needs a rationale; none are permanent.
# Review EVERY entry when the image digest is next upgraded (see deploy/compose.yaml;
# the postgres-image-update workflow opens a PR when the official digest moves) and
# when an entry nears its expired_at.
#
# Migrated 2026-09-07 from the legacy text .trivyignore to .trivyignore.yaml so entries
# can scope by package (purls) and expire (expired_at). Format docs:
# https://aquasecurity.github.io/trivy/latest/docs/configuration/filtering/#trivyignoreyaml

vulnerabilities:
  # G6.3 (2026-08-26): Postgres image scan exemptions, each with rationale.
  # Review EVERY entry when the image digest is next upgraded (see
  # deploy/compose.yaml) — drop the entries that no longer apply.
  #
  # OpenSSL QUIC-server memory-growth DoS (libcrypto3/libssl3 3.5.7-r0,
  # fixed 3.5.8-r0): Postgres serves TCP TLS, never QUIC, so the vulnerable
  # code path is not reachable.
  #
  # gosu (/usr/local/bin/gosu): Go su-wrapper used only by the entrypoint.
  # The full golang CVE set below is local-DoS class in bundled tooling, not
  # part of the postgres server attack surface.
  #
  # golang toolchain local-DoS inside the alpine image (net/url, crypto/tls):
  # bundled tooling, not part of the postgres server attack surface.
  - id: CVE-2026-14456
