  # --- Temporary: util-linux (libuuid 2.42.1-r0) inherited from the
  # postgres:17.11-alpine / alpine 3.24.1 base (digest sha256:18cfe3ef..., built
  # 2026-08-13). Fix exists upstream (util-linux 2.42.3-r0/r1) but no official alpine
  # rebuild is published yet - 18cfe3ef... is still the newest official postgres 17
  # alpine image (17-alpine / 17.11-alpine / 17-alpine3.24 all point at it). The
  # postgres-image-update workflow opens a PR as soon as upstream rebuilds and strips
  # this section automatically once its probe scan of the rebuilt image passes.
  #
  # Scope/rationale: local-privilege / restricted-mount vulnerabilities in util-linux
  # (mount(8), nsenter, X-mount). Their documented exploit chains depend on
  # attacker-controlled /etc/fstab user mounts, X-mount.* options, restricted bind
  # mounts, external mount helpers, or a privileged operator invoking
  # nsenter --join-cgroup - none of which are part of the deployed postgres workload
  # or its configuration. CVE-2026-53614 specifically needs SUID mount(8) plus an
  # fstab user bind mount of attacker content under nosuid/noexec - not configured
  # in this container.
  # Added 2026-09-07. Review 2026-10-07 (hard expiry via expired_at): the Security
  # gate goes red again on that date if the image has not been rebuilt by then.
  - id: CVE-2026-53612
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: TOCTOU in mount(8) post-mount ownership/mode changes - requires SUID mount + fstab user mount; absent from the postgres workload.
  - id: CVE-2026-53613
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: TOCTOU in mount(8) via ancestor directory swap - requires SUID mount + attacker-writable ancestor dirs; absent from the postgres workload.
  - id: CVE-2026-53614
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: SUID mount nosuid/noexec bypass via LIBMOUNT_FORCE_MOUNT2 - requires an fstab user bind mount of SUID content under nosuid/noexec; not configured here.
  - id: CVE-2026-76642
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: Failed external mount helper runs privileged X-mount post-hooks - requires fstab user-mount + external helper config; absent from the postgres workload.
  - id: CVE-2026-78408
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: nsenter --join-cgroup leaks root cgroup migration authority - needs a privileged operator to invoke nsenter against an attacker target; not part of the workload.
  - id: CVE-2026-78409
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: X-mount.subdir detached-tree escape via symlinks - requires fstab-authorized X-mount.subdir; absent from the postgres workload.
  - id: CVE-2026-78410
    purls:
      - pkg:apk/alpine/libuuid
    expired_at: 2026-10-07
    statement: Restricted bind mounts do not pin source - requires fstab-authorized restricted mounts + X-mount.owner/group/mode; absent from the postgres workload.
  # --- end util-linux temporary set (2026-09-07; this section is stripped wholesale by postgres-image-update)
