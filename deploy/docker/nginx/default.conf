# MiQroKey production reverse proxy (#479): TLS termination, SPA static hosting,
# /api → control-plane, /v1 + /mcpservers → gateway. Loaded from
# /etc/nginx/conf.d/default.conf inside the portal image.

upstream miqrokey_control_plane {
    server control-plane:8080;
    keepalive 16;
}

upstream miqrokey_gateway {
    server gateway:8081;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Container health probe; everything else upgrades to TLS.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Agent 请求体（长上下文/大附件）可达数 MB；256KB 是网关解析缓冲上限，与请求体大小无关。
    # 32m 覆盖正常 Agent 流量，同时仍拦截明显滥用。
    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        expires -1;
    }

    location /assets/ {
        expires 30d;
    }

    location /api/ {
        proxy_pass http://miqrokey_control_plane;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Inference data plane: streaming responses, so no buffering and long reads.
    location /v1/ {
        proxy_pass http://miqrokey_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP data plane: long-lived SSE sessions plus JSON-RPC posts.
    location /mcpservers/ {
        proxy_pass http://miqrokey_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
