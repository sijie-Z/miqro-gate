# MiQroKey Gateway — Local Development Stack
# Start: docker compose -f deploy/compose.yaml up -d
# Stop:  docker compose -f deploy/compose.yaml down

services:
  postgres:
    # Multi-platform manifest digest of the current official postgres:17.11-alpine
    # (built 2026-08-13; PG 17.11 is the newest 17.x patch). Originally pinned as
    # "17.6-alpine" - the label was stale; the image content is the 17.11 build.
    # The postgres-image-update workflow bumps this digest when docker-library
    # rebuilds the alpine image; update label/comment to match then.
    image: postgres:17.11-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: miqrokey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miqrokey}
      POSTGRES_USER: ${POSTGRES_USER:-miqrokey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "${MIQROKEY_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miqrokey} -d ${POSTGRES_DB:-miqrokey}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
    driver: local
