# MiQroKey Gateway — production single-host stack (#479).
#
#   cd deploy
#   cp .env.prod.example .env      # edit: domain, allowlist…
#   mkdir -p secrets/certs && 生成密钥/证书（见 secrets/README.md）
#   docker compose -f compose.prod.yaml up -d --build
#
# 密钥注入：`secrets-init` 一次性把 deploy/secrets/ 同步进命名卷 secrets-store 并设定属主/权限，
# 应用容器只读挂载该卷。不用 compose `secrets:`/宿主 bind：Docker Desktop（Windows）对宿主文件
# 呈现合成权限且忽略 secrets 的 uid/gid/mode（实测 0777），无法得到确定的 0400；卷内权限由
# Linux 侧 chmod，本机开发与 Linux 生产行为一致。
# 仅 portal 发布 80/443；TLS 证书：deploy/secrets/certs/{fullchain,privkey}.pem（bind 挂载，root 读取）。

name: miqrokey

services:
  # 一次性密钥同步：master/vk-hmac/bootstrap 严格 0400（FileSecretProvider 强制）；db_password/
  # backup_key 0440 属主 10001:70（应用 uid 10001 与备份容器 postgres uid 70 均可读）。
  secrets-init:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /src/master_key /src/vk_hmac_key /src/bootstrap_secret /src/db_password /src/backup_key /dst/
        chown 10001:10001 /dst/master_key /dst/vk_hmac_key /dst/bootstrap_secret
        chmod 400 /dst/master_key /dst/vk_hmac_key /dst/bootstrap_secret
        chown 10001:70 /dst/db_password /dst/backup_key
        chmod 440 /dst/db_password /dst/backup_key
        echo "secrets-init: $(ls -l /dst | tail -n +2)"
    volumes:
      - ./secrets:/src:ro
      - secrets-store:/dst
    networks: [internal]

  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miqrokey}
      POSTGRES_USER: ${POSTGRES_USER:-miqrokey}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets-store:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miqrokey} -d ${POSTGRES_DB:-miqrokey}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]

  control-plane:
    image: miqrokey-control-plane:${MIQROKEY_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/control-plane.Dockerfile
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      MIQROKEY_PRODUCTION: "true"
      # ProductionStartupValidator 硬性要求（不满足即拒绝启动）；不会自动启用。
      MIQROKEY_COOKIE_SECURE: "true"
      MIQROKEY_PUBLIC_BASE_URL: ${MIQROKEY_PUBLIC_BASE_URL:-https://localhost}
      MIQROKEY_GATEWAY_BASE_URL: ${MIQROKEY_GATEWAY_BASE_URL:-https://localhost}
      MIQROKEY_ORIGIN_ALLOWLIST: ${MIQROKEY_ORIGIN_ALLOWLIST:-https://miqrokey.example.com}
      MIQROKEY_REGISTRATION_ENABLED: ${MIQROKEY_REGISTRATION_ENABLED:-true}
      MIQROKEY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-miqrokey}
      MIQROKEY_DB_USERNAME: ${POSTGRES_USER:-miqrokey}
      MIQROKEY_DB_PASSWORD_FILE: /run/secrets/db_password
      MIQROKEY_CRYPTO_ENABLED: "true"
      MIQROKEY_CRYPTO_ENCRYPTION_ACTIVE_VERSION: v1
      MIQROKEY_CRYPTO_ENCRYPTION_VERSIONS_V1: /run/secrets/master_key
      MIQROKEY_CRYPTO_HMAC_ACTIVE_VERSION: v1
      MIQROKEY_CRYPTO_HMAC_VERSIONS_V1: /run/secrets/vk_hmac_key
      MIQROKEY_BOOTSTRAP_SECRET_FILE: /run/secrets/bootstrap_secret
      MIQROKEY_CONTROL_ADMIN_TRUSTED_PROXIES: ${MIQROKEY_CONTROL_ADMIN_TRUSTED_PROXIES:-172.28.0.0/24}
      MIQROKEY_CONTROL_ADMIN_IP_ALLOWLIST: ${MIQROKEY_CONTROL_ADMIN_IP_ALLOWLIST:-}
    volumes:
      - secrets-store:/run/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [internal]

  gateway:
    image: miqrokey-gateway:${MIQROKEY_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      MIQROKEY_GATEWAY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-miqrokey}
      MIQROKEY_GATEWAY_DB_USERNAME: ${POSTGRES_USER:-miqrokey}
      MIQROKEY_GATEWAY_DB_PASSWORD_FILE: /run/secrets/db_password
      MIQROKEY_CRYPTO_ENABLED: "true"
      MIQROKEY_CRYPTO_ENC_KEY_FILE: /run/secrets/master_key
      MIQROKEY_CRYPTO_HMAC_KEY_FILE: /run/secrets/vk_hmac_key
    volumes:
      - secrets-store:/run/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks: [internal]

  portal:
    image: miqrokey-portal:${MIQROKEY_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/portal.Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
      gateway:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./secrets/certs:/etc/nginx/certs:ro
    healthcheck:
      # 显式 127.0.0.1：busybox wget 对 localhost 优先 ::1，而 nginx 默认只监听 IPv4。
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  backup:
    image: miqrokey-backup:${MIQROKEY_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: deploy/docker/backup.Dockerfile
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MIQROKEY_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-miqrokey}
      MIQROKEY_DB_USERNAME: ${POSTGRES_USER:-miqrokey}
      MIQROKEY_DB_PASSWORD_FILE: /run/secrets/db_password
      MIQROKEY_BACKUP_PATH: /var/backups/miqrokey
      MIQROKEY_BACKUP_KEY_FILE: /run/secrets/backup_key
      MIQROKEY_BACKUP_WEBHOOK_URL: ${MIQROKEY_BACKUP_WEBHOOK_URL:-}
      MIQROKEY_BACKUP_WEBHOOK_SECRET: ${MIQROKEY_BACKUP_WEBHOOK_SECRET:-}
    volumes:
      - backups:/var/backups/miqrokey
      - secrets-store:/run/secrets:ro
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  backups:
  secrets-store:
