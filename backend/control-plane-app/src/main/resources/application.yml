server:
  port: ${MIQROKEY_CONTROL_PORT:8080}

spring:
  application:
    name: miqrokey-control-plane
  main:
    web-application-type: servlet
  datasource:
    url: ${MIQROKEY_DB_URL:jdbc:postgresql://localhost:5432/miqrokey}
    username: ${MIQROKEY_DB_USERNAME:miqrokey}
    password: ${MIQROKEY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${MIQROKEY_DB_POOL_MAX_SIZE:20}
      minimum-idle: 2
  flyway:
    enabled: ${MIQROKEY_DB_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

miqrokey:
  # 自助注册开关（F-REG）：默认开启便于内测/试用；需要邀请制时置 false。
  registration-enabled: ${MIQROKEY_REGISTRATION_ENABLED:true}
  control:
    admin-access:
      # 管理门户来源 IP 白名单（F05，security §6）：空 = 不限制（历史行为）。
      # 配置后仅名单内地址可访问门户面（/api/v1/billing/** 外部通道与
      # /api/v1/auth/bootstrap 引导豁免）。反代部署时 trusted-proxies 列出
      # 受信代理 CIDR，只有来自它们的 X-Forwarded-For 才被采纳。
      ip-allowlist: ${MIQROKEY_CONTROL_ADMIN_IP_ALLOWLIST:}
      trusted-proxies: ${MIQROKEY_CONTROL_ADMIN_TRUSTED_PROXIES:}
    provider-client:
      # Bounds for control-plane provider calls (G3.1): connect timeout,
      # overall request deadline, single-response body cap.
      connect-timeout: ${MIQROKEY_CONTROL_PROVIDER_CLIENT_CONNECT_TIMEOUT:10s}
      request-timeout: ${MIQROKEY_CONTROL_PROVIDER_CLIENT_REQUEST_TIMEOUT:30s}
      max-response-bytes: ${MIQROKEY_CONTROL_PROVIDER_CLIENT_MAX_RESPONSE_BYTES:1048576}
  approval:
    # Model IDs that skip the review cycle (exact, case-sensitive). A request
    # for a whitelisted model is auto-approved and takes effect immediately.
    whitelist-models: ${MIQROKEY_APPROVAL_WHITELIST_MODELS:}

# OpenAPI 3.1 generation (F09, api-contract §8): the machine-readable contract
# served at /v3/api-docs. UI bundle is intentionally not included; the spec is
# the artifact CI diffs against the committed baseline. Info and security
# scheme docs are applied by OpenApiSecuritySchemes (config package).
springdoc:
  api-docs:
    version: OPENAPI_3_1
    enabled: true
  swagger-ui:
    enabled: false

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.miqroera.miqrokey: ${MIQROKEY_LOG_LEVEL:INFO}
