server:
  port: ${MIQROKEY_GATEWAY_PORT:8081}
  netty:
    # G2.6: reject oversized inbound headers before the handler runs.
    max-header-size: ${MIQROKEY_MAX_INBOUND_HEADER_BYTES:32KB}

spring:
  application:
    name: miqrokey-gateway
  main:
    web-application-type: reactive
  # The gateway never runs Flyway migrations (the control plane owns schema
  # evolution); flyway-core is on the classpath via persistence-postgres.
  flyway:
    enabled: false

miqrokey:
  crypto:
    # Key encryption + virtual key HMAC. Required when persistence is enabled.
    enabled: ${MIQROKEY_CRYPTO_ENABLED:true}
    encryption:
      active-version: ${MIQROKEY_CRYPTO_ENC_ACTIVE_VERSION:v1}
      versions:
        v1: ${MIQROKEY_CRYPTO_ENC_KEY_FILE:}
    hmac:
      active-version: ${MIQROKEY_CRYPTO_HMAC_ACTIVE_VERSION:v1}
      versions:
        v1: ${MIQROKEY_CRYPTO_HMAC_KEY_FILE:}

  # 调用方 IP 记录（#605）：仅当直连对端命中这些可信代理 CIDR 时，才消费
  # X-Forwarded-For（从右往左取第一个非可信地址）。空 = 只记录直连对端地址，
  # 请求头永不采信。compose 部署经 nginx 反代时为内网段 172.28.0.0/24。
  trusted-proxy:
    cidrs: ${MIQROKEY_TRUSTED_PROXY_CIDRS:}

  gateway:
    # Database-backed mode (route snapshot, L2 cache, usage writer).
    persistence:
      enabled: ${MIQROKEY_GATEWAY_PERSISTENCE_ENABLED:true}
      url: ${MIQROKEY_GATEWAY_DB_URL:jdbc:postgresql://localhost:5432/miqrokey}
      username: ${MIQROKEY_GATEWAY_DB_USERNAME:miqrokey}
      password: ${MIQROKEY_GATEWAY_DB_PASSWORD:}
      pool-size: ${MIQROKEY_GATEWAY_DB_POOL_SIZE:5}
    route-snapshot:
      refresh-interval: ${MIQROKEY_GATEWAY_ROUTE_REFRESH_INTERVAL:30s}
      # #846: while the last refresh failed with "schema not built yet"
      # (PostgreSQL 42P01 — Flyway has not finished on a fresh deployment),
      # this short ticker retries with 2→4→8→16→30s backoff instead of waiting
      # out refresh-interval. Idle cost when the schema is ready: one atomic check.
      retry-check-interval: ${MIQROKEY_GATEWAY_ROUTE_RETRY_CHECK_INTERVAL:2s}
      notify-channel: ${MIQROKEY_GATEWAY_ROUTE_NOTIFY_CHANNEL:miqrokey_route_refresh}
    queue:
      capacity: ${MIQROKEY_GATEWAY_QUEUE_CAPACITY:50000}
      flush-threshold: ${MIQROKEY_GATEWAY_QUEUE_FLUSH_THRESHOLD:100}
      flush-interval: ${MIQROKEY_GATEWAY_QUEUE_FLUSH_INTERVAL:1s}
      writer-threads: ${MIQROKEY_GATEWAY_QUEUE_WRITER_THREADS:4}
    coalescer:
      # Request coalescing (single-flight): DISABLED by default (ADR-0008).
      enabled: ${MIQROKEY_GATEWAY_COALESCER_ENABLED:false}
      wait-timeout: ${MIQROKEY_GATEWAY_COALESCER_WAIT_TIMEOUT:2s}
    upstream:
      connect-timeout: ${MIQROKEY_UPSTREAM_CONNECT_TIMEOUT:PT10S}
      first-byte-timeout: ${MIQROKEY_UPSTREAM_FIRST_BYTE_TIMEOUT:PT120S}
      stream-idle-timeout: ${MIQROKEY_UPSTREAM_STREAM_IDLE_TIMEOUT:PT5M}
      response-timeout: ${MIQROKEY_UPSTREAM_RESPONSE_TIMEOUT:PT10M}
      max-proxy-buffer: ${MIQROKEY_MAX_PROXY_BUFFER_BYTES:256KB}
      # G2.6 SSRF guard: CIDRs whose addresses may be targeted even though they
      # are non-public (loopback/link-local/private) or plain http. Empty =
      # https-only, public-address-only targets.
      allowed-cidrs: ${MIQROKEY_UPSTREAM_ALLOWED_CIDRS:}
    # #553 请求前置预检：按体量（UTF-8 码点）拒绝超大 context，超限不连接上游。
    # 阈值是最保守的上界（整个序列化 body 都计入），高于 max-proxy-buffer 时
    # 由缓冲上限先拒绝（payload_too_large）。默认宽松，是安全阀而非配额。
    context-limit:
      enabled: ${MIQROKEY_GATEWAY_CONTEXT_LIMIT_ENABLED:true}
      threshold-chars: ${MIQROKEY_GATEWAY_CONTEXT_LIMIT_THRESHOLD_CHARS:200000}
    # #741 LLM 侧熔断（默认关）：按（产品 × 凭证）隔离，连败超阈值后快速失败
    # 503 circuit_open，超时后半开探活自动恢复。默认阈值对齐 MCP F13（腾讯口径）。
    # 关闭时零行为变化：不查、不建桶、计数恒零。
    circuit-breaker:
      enabled: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_ENABLED:false}
      window-seconds: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_WINDOW_SECONDS:10}
      min-requests: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_MIN_REQUESTS:10}
      error-ratio: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_ERROR_RATIO:50}
      error-status-codes: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_ERROR_STATUS_CODES:500,502,503,504}
      open-seconds: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_OPEN_SECONDS:30}
      probe-count: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_PROBE_COUNT:3}
      probe-success: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_PROBE_SUCCESS:2}
      slow-enabled: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_SLOW_ENABLED:false}
      slow-call-ms: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_SLOW_CALL_MS:3000}
      slow-ratio: ${MIQROKEY_GATEWAY_CIRCUIT_BREAKER_SLOW_RATIO:80}
    # #740 内容过滤 shadow v1（ADR-0027，默认关）：网关进程内用本地词表对输入/输出
    # 只观察——评估/命中计数器 + 一行无正文日志；零阻断、零改写，转发与回放字节不变；
    # 关闭时不评估、不注册指标、无日志（热路径零行为变化）。词表语法：
    # 类别=词1|词2;类别2=词3（类别=有界 metric tag；词=大小写不敏感子串；同类别每次
    # 评估最多记 1 次命中）。正文/词绝不进日志与指标。
    content-filter:
      enabled: ${MIQROKEY_GATEWAY_CONTENT_FILTER_ENABLED:false}
      vocabulary: ${MIQROKEY_GATEWAY_CONTENT_FILTER_VOCABULARY:}

  cache:
    # Response cache (L1 Caffeine + L2 PostgreSQL): DISABLED by default.
    enabled: ${MIQROKEY_CACHE_ENABLED:false}
    l1:
      enabled: ${MIQROKEY_CACHE_L1_ENABLED:true}
      ttl: ${MIQROKEY_CACHE_L1_TTL:300s}
    l2:
      enabled: ${MIQROKEY_CACHE_L2_ENABLED:true}
      ttl: ${MIQROKEY_CACHE_L2_TTL:300s}

# Actuator health and metrics (no sensitive data exposed)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.miqroera.miqrokey: ${MIQROKEY_LOG_LEVEL:INFO}
    reactor.netty: WARN
